name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, suffix: ""}
          - {goos: linux, goarch: arm64, suffix: ""}
          - {goos: windows, goarch: amd64, suffix: ".exe"}
          - {goos: darwin, goarch: arm64, suffix: ""}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - name: Build core
        working-directory: core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o ../guardcompress-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: guardcompress-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect ffmpeg static (maintainer menaruh file ffmpeg-* di draft release)
        run: |
          ls -la dist/
          echo "Lihat docs/FFMPEG.md: taruh ffmpeg-linux-amd64, ffmpeg-windows-amd64.exe, dst. ke dist/ sebelum publish."
      - name: CHECKSUMS.txt
        run: |
          cd dist && sha256sum guardcompress-* ffmpeg-* 2>/dev/null > CHECKSUMS.txt || sha256sum guardcompress-* > CHECKSUMS.txt
          cat CHECKSUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
