name: subtree-split
on:
  push:
    tags: ["v*"]
jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { prefix: wrappers/node, branch: split-js, repo: guardcompress-js }
          - { prefix: wrappers/php, branch: split-php, repo: guardcompress-php }
          - { prefix: wrappers/python, branch: split-python, repo: guardcompress-python }
          - { prefix: wrappers/go, branch: split-go, repo: guardcompress-go }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git subtree split --prefix=${{ matrix.prefix }} -b ${{ matrix.branch }}
      - env:
          PUSH_TOKEN: ${{ secrets.SPLIT_PAT }}
        run: git push "https://x-access-token:${PUSH_TOKEN}@github.com/NTI-Nova-Teknologi-Inovatif/${{ matrix.repo }}.git" ${{ matrix.branch }}:main --force
