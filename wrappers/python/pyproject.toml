[project]
name = "guardcompress"
version = "0.1.0"
description = "Keamanan + kompresi upload untuk Python (Django/Flask/FastAPI). Binary inti Go + ffmpeg otomatis terunduh saat install."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "NTI (Nova Teknologi Inovatif)" }]
keywords = ["upload", "security", "antivirus", "webshell", "image-compression", "ffmpeg", "django", "flask"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/NTI-Nova-Teknologi-Inovatif/guardcompress"
Issues = "https://github.com/NTI-Nova-Teknologi-Inovatif/guardcompress/issues"

[project.scripts]
guardcompress-install = "guardcompress.install:main"

[build-system]
requires = ["setuptools"]

[tool.setuptools.packages.find]
where = ["src"]
